<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>先做一刻 · 回到手上的事</title><link rel="stylesheet" href="style.css"></head><body><main>
<div class="brand">◒　先做一刻</div><div class="eyebrow">你正在做</div><h1 id="task">正在读取当前任务…</h1><p class="step" id="step"></p><div class="timer" id="timer">--:--</div><p class="muted" id="hint">先把这一步做完，信息流可以等一会儿。</p>
<div class="actions"><button class="primary" id="back">返回任务</button><button id="request">临时访问</button></div>
<section id="unlock" hidden><p class="muted" id="waitText">给自己 30 秒，再决定要不要打开。</p><textarea id="reason" rows="2" maxlength="240" placeholder="想打开的原因（可不填）"></textarea><div class="actions"><button id="confirm" class="primary">开始等待 30 秒</button><button id="cancel">继续专注</button></div></section>
<p id="error" class="muted" role="status"></p></main><script type="module" src="blocked.js"></script></body></html>
